# Deutsche Texte der Weboberfläche. Fehlt ein Eintrag, nimmt LoxBerry den englischen.
# %s / %d werden von der Seite ersetzt.

[UI]
TITLE=Abholtermine Umweltprofis
NAV_STATUS=Status
NAV_SETTINGS=Einstellungen
NAV_LOG=Log

STATUS=Status
SERVICE=Bridge-Dienst
RUNNING=läuft
STOPPED=gestoppt
ADDRESS=Adresse
NO_ADDRESS=keine Adresse eingestellt
SETUP_FIRST=Bitte zuerst unter %s die Adresse auswählen und speichern.
MQTT=MQTT
CONNECTED=verbunden
NOT_CONNECTED=nicht verbunden
LAST_FETCH=Letzter Abruf
ERROR=Fehler
UPCOMING=Termine der nächsten %d Tage
NO_DATA=Noch keine Termine abgerufen – nach dem Speichern der Adresse dauert es einige Sekunden.
NO_ENTRIES=Im eingestellten Zeitraum ist keine Abholung.
COL_DATE=Datum
COL_TYPE=Abfallart
COL_INTERVAL=Intervall
COL_IN=Wann
TODAY=heute
TOMORROW=morgen
IN_DAYS=in %d Tagen
TOPICS=MQTT-Topics
COL_TOPIC=Topic
COL_VALUE=Wert
COL_LOXONE=Eingang im Miniserver (MQTT Gateway)
BTN_REFRESH=Jetzt abrufen
BTN_RESTART=Neu starten
BTN_STOP=Stoppen
HINT_GATEWAY=Damit die Werte am Miniserver ankommen, im MQTT Gateway das Topic %s abonnieren.
HINT_REFRESH=Eine beliebige Nachricht an %s löst sofort einen neuen Abruf aus.

ENABLED=Bridge aktiviert
ADDRESS_HINT=Die Listen kommen direkt von umweltprofis.at (Abholkalender der OÖ Bezirksabfallverbände).
DISTRICT=Bezirk
CITY=Ort
STREET=Straße
HOUSE=Hausnummer
CHOOSE=– bitte wählen –
LOADING=Lade Liste von umweltprofis.at …
DATES=Termine
DAYS=Zeitraum (Tage)
DAYS_HINT=umweltprofis.at liefert die Termine des laufenden und des nächsten Monats – mehr als ca. 30 Tage sind nicht immer verfügbar.
REMINDER_TIME=Erinnerung am Vortag um
REMINDER_HINT=%s wird am Tag vor einer Abholung ab dieser Uhrzeit 1 (bis Mitternacht). Die steigende Flanke eignet sich für eine Push-Benachrichtigung im Miniserver.
TYPES=Abfallarten
TYPES_HINT=Gibt es für eine Abfallart mehrere Intervalle (z. B. Restabfall 2- oder 4-wöchentlich), das eigene auswählen. „Nie“ blendet die Abfallart aus.
TYPES_AFTER_FETCH=Die Abfallarten erscheinen hier nach dem ersten erfolgreichen Abruf.
FILTER_DEFAULT=Standard
FILTER_ONLY=nur %s
FILTER_ALL=alle Intervalle
FILTER_NEVER=Nie (ausblenden)
REFRESH_HOURS=Termine neu abrufen alle (Stunden)
BASE_TOPIC=Basis-Topic
REPUBLISH=Alle Werte erneut senden alle (Sekunden)
USE_LOXBERRY=MQTT-Zugangsdaten des LoxBerry verwenden
BROKER_HOST=Broker-Adresse
BROKER_PORT=Broker-Port
BROKER_USER=Benutzer
BROKER_PASSWORD=Passwort
PASSWORD_SAVED=(gespeichert – leer lassen, um es zu behalten)
LOGGING=Protokollierung
SAVE=Speichern

[MSG]
SAVED=Gespeichert.
SAVE_FAILED=Die Einstellungen konnten nicht gespeichert werden.
RUNNING=Die Bridge läuft.
NOT_RUNNING=Die Bridge läuft nicht (deaktiviert? Log prüfen).
REFRESH_REQUESTED=Abruf angefordert – die Termine erscheinen in einigen Sekunden.
LOOKUP_FAILED=umweltprofis.at ist nicht erreichbar oder hat unerwartet geantwortet.
